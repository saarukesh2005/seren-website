name: Build SEREN Counter for Windows

# Builds the Windows installer (SEREN-Counter-Setup-<version>.exe) on a real Windows machine
# whenever the desktop app changes. Two jobs:
#   build   - read-only; makes the installer and its SHA256 checksum.
#   release - only on main; vouches for the file (build provenance) and puts it on the Releases page.
# A release tag (counter-v<version>) is never overwritten: raise "version" in desktop/package.json for a new one.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false # never stop a release half-way

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Read the version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Write the SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "SEREN-Counter-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLower()
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) "SHA256SUMS.txt"), "$hash  $($exe.Name)`n", (New-Object System.Text.UTF8Encoding($false)))
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SEREN-Counter-Windows
          path: |
            desktop/dist/SEREN-Counter-Setup-*.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SEREN-Counter-Windows
          path: dist
      - name: Check the checksum survived the trip
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Refuse to overwrite an existing release
        run: |
          TAG="counter-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Raise the version in desktop/package.json to publish a new one."
            exit 1
          fi
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/SEREN-Counter-Setup-*.exe
      - name: Put it on the Releases page
        run: |
          TAG="counter-v$VERSION"
          gh release create "$TAG" dist/SEREN-Counter-Setup-*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SEREN Counter $VERSION (Windows)" \
            --notes "Windows installer for the SEREN shop counter. Download SEREN-Counter-Setup-$VERSION.exe below, run it, and type your shop server address on first start. SHA256SUMS.txt holds the file's checksum, and the build is attested with GitHub build provenance (verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY)."
