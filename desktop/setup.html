<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>SEREN Counter · Setup</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#662937;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:#140C0E}
  .card{background:#F8EEDC;border-radius:28px;padding:36px 32px;width:min(460px,92vw);display:grid;gap:12px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
  h1{margin:0;font:900 40px/1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;text-transform:uppercase}
  img{width:64px;height:64px}
  p{margin:0;color:#5b4b47}
  label{font-weight:700;font-size:14px}
  input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid #d9c9b6;background:#FFFDF8}
  input:focus{outline:none;border-color:#662937}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px;background:#140C0E;color:#EBCB8B;cursor:pointer}
  button:disabled{opacity:.5}
  button.ghost{background:transparent;color:#140C0E;border:2px solid #140C0E;margin-top:10px}
  .err{color:#c0392b;font-weight:700;min-height:1.4em}
</style>
</head>
<body>
<form class="card" id="f">
  <img src="build/icon.png" alt="">
  <h1>SEREN Counter</h1>
  <p>One-time setup: type the address of your SEREN order system (it ends in <b>.workers.dev</b>). You'll find it in the setup guide.</p>
  <label for="url">Shop server address</label>
  <input id="url" placeholder="https://seren-orders.yourname.workers.dev" autocomplete="off" spellcheck="false" required>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go">Connect</button>
  <button type="button" id="cancel" class="ghost" hidden>Cancel, keep the current shop</button>
</form>
<script src="setup.js"></script>
</body>
</html>
