<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>SEREN Counter · No connection</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#662937;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:#140C0E}
  .card{background:#F8EEDC;border-radius:28px;padding:36px 32px;width:min(460px,92vw);display:grid;gap:12px;text-align:center}
  h1{margin:0;font:900 34px/1.1 Impact,"Arial Black",sans-serif;text-transform:uppercase}
  img{width:64px;height:64px;justify-self:center}
  p{margin:0;color:#5b4b47}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px;background:#140C0E;color:#EBCB8B;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="build/icon.png" alt="">
  <h1>Can't reach the shop server</h1>
  <p>Check the internet connection. Once the counter has opened with internet one time, it keeps working without internet and sends bills when the connection is back.</p>
  <button type="button" id="retry">Try again</button>
</div>
<script src="setup.js"></script>
</body>
</html>
