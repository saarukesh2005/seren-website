<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="SEREN Entremets">
<meta property="og:description" content="Bomboloni, cookies, illusory fruit, entremets, gelato, chocolates and a wood-fired kitchen.">
<meta property="og:image" content="img/bonbon-caramel.webp">
<title>Your SEREN order</title>
<meta name="description" content="Track your SEREN order and pay by UPI.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#662937">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* SEREN — layout: a sequence of full-bleed colour "slabs" taken from the cover (caramel / plum / butter / ink),
   each slab one product family with its own motion moment; fixed nav + slide-in order box. */
:root{
  --caramel:#C89B6F; --plum:#662937; --aubergine:#57293A; --butter:#EBCB8B;
  --cream:#F8EEDC; --ink:#140C0E; --ink-2:#22161A; --white:#FFFDF8; --veg:#119A3A; --nonveg:#D32D25;
  --display:"Anton","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"DM Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --caramel-deep:color-mix(in srgb,var(--caramel) 80%,#000);
  --ink-2:color-mix(in srgb,var(--ink) 92%,#fff);
  --ink-deep:color-mix(in srgb,var(--ink) 75%,#000);
  --muted-dark:color-mix(in srgb,var(--ink) 72%,transparent);
  --muted-light:color-mix(in srgb,var(--cream) 72%,transparent);
  --card:color-mix(in srgb,var(--cream) 70%,var(--caramel));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:auto}
body{background:var(--ink);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--butter);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.88;letter-spacing:.005em;margin:0;text-wrap:balance}
.hand{font-family:var(--hand);font-weight:600}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase}
.slab{position:relative;padding-block:clamp(72px,10vw,140px);overflow:hidden}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);pointer-events:none}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.nav a,.nav button{pointer-events:auto}
.logo{font-family:var(--display);font-size:28px;letter-spacing:.02em;text-decoration:none;line-height:1;display:flex}
.logo span:nth-child(-n+2){color:var(--aubergine)} .logo span:nth-child(n+3){color:var(--butter)}
.nav.solid{background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(10px);pointer-events:auto}
.nav.solid .logo span:nth-child(-n+2){color:var(--caramel)}
.links{display:flex;gap:22px;font-size:14px;font-weight:500}
.links a{text-decoration:none;opacity:.85} .links a:hover{opacity:1;color:var(--butter)}
.box-btn{display:flex;align-items:center;gap:8px;background:var(--butter);color:var(--ink);border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.box-btn:hover{filter:brightness(1.06)}
.box-btn b{background:var(--ink);color:var(--butter);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.box-btn.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.18) rotate(-4deg)}}
@media (max-width:860px){.links{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(100svh,920px);display:grid;place-items:center;overflow:hidden;background:var(--plum)}
.hero .half{position:absolute;top:0;bottom:0;width:50%}
.hero .half.l{left:0;background:var(--caramel)} .hero .half.r{right:0;background:var(--plum)}
.hero-word{position:relative;z-index:2;display:flex;font-family:var(--display);font-size:clamp(120px,27vw,420px);line-height:.8;letter-spacing:-.01em;user-select:none}
.hero-word span{display:inline-block;will-change:transform}
.hero-word span:nth-child(-n+2){color:var(--aubergine)} .hero-word span:nth-child(n+3){color:var(--butter)}
.hero .tag{position:absolute;z-index:3;font-size:clamp(14px,1.5vw,20px);letter-spacing:.1em;color:var(--white)}
.hero .tag.tr{top:clamp(80px,12vh,120px);right:var(--gutter-r);margin-right:2vw}
.hero .tag.bl{bottom:clamp(40px,8vh,90px);left:var(--gutter-l);margin-left:2vw}
.hero .arrow{position:absolute;z-index:3;left:calc(var(--gutter-l) + 3vw);bottom:clamp(80px,14vh,150px);width:clamp(120px,20vw,280px);color:var(--ink)}
.burst{position:absolute;z-index:3;width:clamp(48px,6vw,84px);color:var(--white)}
.burst.a{top:clamp(80px,12vh,120px);left:calc(var(--gutter-l) + 3vw)} .burst.b{bottom:clamp(30px,6vh,70px);right:calc(var(--gutter-r) + 3vw)}
.spin{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.floater{position:absolute;z-index:4;width:clamp(70px,10vw,150px);will-change:transform}
.floater .fl-p,.floater img{display:block;width:100%;will-change:transform}
.floater img{filter:drop-shadow(0 18px 24px rgba(20,12,14,.35))}
.hero .cta{position:absolute;z-index:5;bottom:clamp(28px,6vh,64px);left:0;right:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-inline:16px}
@media (max-width:600px){.hero .arrow{display:none}.hero .tag.bl{bottom:auto;top:clamp(110px,16vh,150px);left:auto;right:var(--gutter-r);margin-right:2vw}.hero .tag.tr{font-size:12px}.hero .cta{bottom:28px}}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid currentColor;cursor:pointer;background:transparent;transition:background .3s var(--ease),color .3s var(--ease)}
.pill:hover{filter:brightness(1.05)}
.pill.fill{background:var(--ink);color:var(--butter);border-color:var(--ink)}
.pill.light{color:var(--white)} .pill.light:hover{background:var(--white);color:var(--plum)}

/* ---------- marquee ---------- */
.marquee{background:var(--butter);color:var(--ink);overflow:hidden;border-block:2px solid var(--ink);padding-block:14px}
.marquee .track{display:flex;width:max-content;animation:marq 38s linear infinite}
.marquee span{font-family:var(--display);font-size:clamp(26px,3.4vw,44px);text-transform:uppercase;padding-inline:22px;display:flex;align-items:center;gap:44px;white-space:nowrap}
.marquee svg{width:28px;height:28px;color:var(--plum)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- intro ---------- */
.intro{background:var(--ink)}
.intro p.big{font-family:var(--display);text-transform:uppercase;font-size:clamp(36px,6.4vw,92px);line-height:.95;margin:0;max-width:16ch}
.intro .w{display:inline-block;transition:opacity .2s}
.js-words .w{opacity:.18}
.js-words .w.on{opacity:1}
.intro .w.gold{color:var(--butter)}
.intro .meta{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:48px;color:var(--caramel)}
.intro .meta div{display:grid;gap:4px} .intro .meta strong{font-family:var(--display);font-size:42px;color:var(--cream);font-weight:400;line-height:1}

/* ---------- section heads ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin-bottom:clamp(36px,5vw,64px)}
.head h2{font-size:clamp(64px,11vw,170px)}
.head p{max-width:42ch;margin:0;font-size:17px}
.head .hand{font-size:28px;display:block;margin-bottom:8px}

/* ---------- add button ---------- */
.add{display:inline-flex;align-items:center;gap:6px;border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background .25s,color .25s,transform .25s var(--ease)}
.add:hover{transform:translateY(-1px)}
.add.added{background:var(--ink);color:var(--butter);border-color:var(--ink)}
.price{font-family:var(--display);font-size:22px}

/* ---------- bomboloni (horizontal pin) ---------- */
.bomb{background:var(--plum);padding-block:0}
.bomb .pin{height:100svh;min-height:640px;display:flex;flex-direction:column;justify-content:center;gap:clamp(20px,4vh,44px);padding-top:70px}
.bomb .head{margin-bottom:0}
.bomb .head h2{color:var(--butter)}
.bomb .rail{display:flex;gap:clamp(18px,2.4vw,32px);padding-left:var(--gutter-l);padding-right:20vw;width:max-content;will-change:transform}
.paper{flex:0 0 clamp(260px,28vw,360px);background:#fbf8f1 repeating-linear-gradient(transparent 0 27px,#cfd8e6 27px 28px);color:var(--ink);border-radius:6px;padding:16px 16px 20px;box-shadow:0 24px 40px -18px rgba(0,0,0,.55);display:grid;gap:10px;position:relative;transform:rotate(var(--r,0deg))}
.paper::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;background:#e7a3a3}
.paper .ph{aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:#fbf8f1;position:relative}
.paper .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.paper:hover .ph img{transform:scale(1.06) rotate(-2deg)}
.paper h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;line-height:.95;margin:0}
.paper .it{font-family:var(--hand);font-size:22px;color:var(--plum);line-height:1}
.paper p{margin:0;font-size:14px;color:var(--muted-dark)}
.paper .row{display:flex;justify-content:space-between;align-items:center}
@media (max-width:760px){.bomb .pin{height:auto;min-height:0;padding-block:96px 72px}.bomb .rail{width:auto;overflow-x:auto;scroll-snap-type:x mandatory;padding-right:var(--gutter-r);padding-bottom:12px}.paper{scroll-snap-align:start;flex-basis:78vw}}

/* ---------- cookies ---------- */
.cookies{background:var(--caramel);color:var(--ink)}
.cookies .head h2{color:var(--aubergine)}
.cookie-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(24px,3vw,44px) clamp(18px,2.5vw,32px)}
.cookie-grid .cookie{flex:0 1 clamp(220px,22%,280px)}
.cookie{display:grid;gap:12px;text-align:center;justify-items:center}
.cookie .disc{width:min(100%,250px);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 30px 40px -24px rgba(60,20,20,.6);will-change:transform}
.cookie .disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.cookie .disc img.alt{opacity:0} .cookie:hover .disc img.alt{opacity:1}
.cookie h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:28px;margin:0;line-height:1}
.cookie p{margin:0;font-size:14px;max-width:28ch;color:var(--muted-dark)}
.science{margin-top:56px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:center;font-family:var(--hand);font-size:24px;color:var(--aubergine)}

/* ---------- illusory fruit ---------- */
.fruit{background:var(--ink)}
.fruit .head h2 em{font-style:normal;color:var(--butter)}
.fruit-stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:center}
.fruit-view{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,#2c1d21 0,#140c0e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.fruit-view .ring{position:absolute;inset:4%;border:1px dashed rgba(235,203,139,.3);border-radius:50%}
.fruit-view img,.fruit-view .blob{width:56%;aspect-ratio:1;object-fit:contain;border-radius:50%;background:var(--white);mix-blend-mode:normal}
.fruit-view .blob{display:grid;place-items:center;font-family:var(--display);font-size:clamp(40px,6vw,80px);text-transform:uppercase;color:var(--ink)}
.fruit-view .layers{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin:0;padding:0 12%}
.fruit-view .layers li{list-style:none;font-family:var(--hand);font-size:22px;line-height:1.1;color:var(--butter);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fruit-view .layers li::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.fruit-list{display:grid;gap:2px;margin:0;padding:0}
.fruit-list button{all:unset;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(248,238,220,.14);font-family:var(--display);font-size:clamp(26px,3.2vw,44px);text-transform:uppercase;color:rgba(248,238,220,.42);transition:color .3s,padding .4s var(--ease)}
.fruit-list button:focus-visible{outline:2px solid var(--butter)}
.fruit-list button[aria-selected="true"],.fruit-list button:hover{color:var(--cream);padding-left:14px}
.fruit-list button small{font:500 13px var(--body);text-transform:none;color:var(--caramel);max-width:30ch;text-align:right}
.fruit-detail{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--butter)}
@media (max-width:860px){.fruit-stage{grid-template-columns:1fr}.fruit-view{aspect-ratio:auto;padding:28px 16px;border-radius:24px}.fruit-view .layers{padding:0}}

/* ---------- entremets ---------- */
.ent{background:var(--aubergine)}
.ent .head h2{color:var(--caramel)}
.ent-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:center}
.cake{position:relative;width:min(100%,520px);margin-inline:auto;padding-top:40px;perspective:900px}
.cake .stack{display:flex;flex-direction:column;width:56%;transform:rotateX(14deg);transform-origin:bottom}
.cake .layer{position:relative;height:clamp(34px,5vw,58px);border-radius:6px;margin-top:-2px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),inset 0 4px 6px rgba(255,255,255,.12)}
.cake .layer:first-child{border-radius:18px 18px 6px 6px;height:clamp(28px,4vw,44px);background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%)!important;background-size:250% 100%!important;animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.cake .layer span{position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);font-family:var(--hand);font-size:22px;color:var(--butter);white-space:nowrap;display:flex;align-items:center;gap:8px}
.cake .layer span::before{content:"";width:28px;height:1px;background:currentColor}
.cake .plate{width:62%;height:14px;margin:4px 0 0 -3%;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(6px)}
.ent-tabs{display:grid;gap:10px}
.ent-tabs button{all:unset;cursor:pointer;display:grid;gap:2px;padding:16px 20px;border-radius:12px;border:1px solid rgba(235,203,139,.2);transition:background .3s,border-color .3s}
.ent-tabs button:focus-visible{outline:2px solid var(--butter)}
.ent-tabs button[aria-selected="true"]{background:var(--plum);border-color:var(--butter)}
.ent-tabs b{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;line-height:1}
.ent-tabs small{color:var(--caramel);font-size:14px}
.ent-note{margin-top:20px;font-size:15px;color:var(--muted-light);max-width:46ch}
@media (max-width:860px){.ent-stage{grid-template-columns:1fr}.cake{width:62%;margin-left:0}}

/* ---------- pastry ---------- */
.pastry{background:var(--cream);color:var(--ink)}
.pastry .head h2{color:var(--plum)}
.pastry-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.pcard{grid-column:span 4;display:grid;gap:12px;align-content:start}
.pcard:nth-child(1),.pcard:nth-child(2){grid-column:span 6}
.pcard .ph{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:4/3;background:var(--card)}
.pcard:nth-child(-n+2) .ph{aspect-ratio:16/11}
.pcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),opacity .5s}
.pcard .ph img.alt{opacity:0}
.pcard:hover .ph img.alt{opacity:1} .pcard:hover .ph img{transform:scale(1.04)}
.pcard .ph .peek{position:absolute;right:12px;bottom:12px;background:var(--ink);color:var(--butter);font-family:var(--hand);font-size:20px;padding:2px 12px;border-radius:999px}
.pcard .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pcard h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;margin:0;line-height:1}
.pcard p{margin:0;font-size:15px;color:var(--muted-dark)}
@media (max-width:860px){.pcard,.pcard:nth-child(1),.pcard:nth-child(2){grid-column:span 12}}

/* ---------- gelato ---------- */
.gelato{background:var(--butter);color:var(--ink)}
.gelato .head h2{color:var(--plum)}
.g-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.g-tabs button{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
.g-tabs button[aria-selected="true"]{background:var(--ink);color:var(--butter)}
.scoops{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 18px}
.scoops .scoop{flex:0 1 160px}
.scoop .drop{display:grid;justify-items:center}
.scoop{display:grid;justify-items:center;gap:10px;text-align:center}
.scoop .ball{width:120px;aspect-ratio:1;border-radius:50% 50% 46% 46%;position:relative;box-shadow:inset -12px -16px 0 rgba(0,0,0,.08),inset 10px 10px 18px rgba(255,255,255,.35),0 18px 22px -14px rgba(60,30,20,.45);transition:transform .5s var(--ease)}
.scoop .ball::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-6px;height:22px;border-radius:0 0 50% 50%/0 0 100% 100%;background:inherit;filter:brightness(.96);clip-path:polygon(0 0,8% 70%,16% 10%,26% 80%,36% 15%,48% 85%,58% 10%,70% 75%,80% 15%,90% 70%,100% 0,100% 0)}
.scoop .ball i{position:absolute;inset:18% 24% auto auto;width:22%;height:16%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px)}
.scoop .ball b{position:absolute;inset:auto auto 26% 22%;width:12px;height:12px;border-radius:50%;background:var(--fleck)}
.scoop:hover .ball{transform:translateY(-8px) rotate(-6deg)}
.scoop .cone{width:84px;height:92px;margin-top:-16px;clip-path:polygon(0 0,100% 0,50% 100%);background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(90,50,25,.45) 9px 11px),repeating-linear-gradient(-45deg,transparent 0 9px,rgba(90,50,25,.45) 9px 11px),linear-gradient(#d39a5c,#b07840)}
.scoop h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:21px;margin:0;line-height:1}
.g-facts{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px}
.g-facts div{border-top:2px solid var(--ink);padding-top:12px}
.g-facts strong{font-family:var(--display);font-weight:400;font-size:46px;display:block;line-height:1}

/* ---------- chocolates ---------- */
.choc{background:var(--ink-deep)}
.choc .head h2{color:var(--butter)}
.bonbon-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,2vw,28px);align-items:end}
.bonbon{display:grid;justify-items:center;gap:10px;text-align:center}
.bonbon .bob{display:block;width:min(100%,190px);will-change:transform}
.bonbon img{width:100%;filter:drop-shadow(0 26px 22px rgba(0,0,0,.6));transition:transform .6s var(--ease)}
.bonbon:hover img{transform:translateY(-14px) rotate(6deg) scale(1.05)}
.bonbon h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:22px;margin:0;line-height:1}
.bonbon p{margin:0;font-size:13px;color:var(--muted-light);max-width:22ch}
.truffles{margin-top:clamp(56px,8vw,100px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,40px)}
.truffle{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:20px;align-items:center;background:var(--ink-2);border-radius:20px;padding:18px}
.truffle img{border-radius:14px;aspect-ratio:1;object-fit:cover;width:100%}
.truffle h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;margin:0 0 6px;line-height:1}

/* ---------- order box drawer ---------- */

/* SEREN — extra motion pieces: cursor, scroll progress, drips, fruit slice, fly-to-box, colour switcher. */

/* page stays still while the order box is open */
html.box-open,html.lenis-stopped{overflow:hidden}
.drawer,.drawer ul{overscroll-behavior:contain}

/* headings keep whole words together while letters animate */
.wd{display:inline-block;white-space:nowrap}

/* scroll progress line under the nav */
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--butter);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}

/* custom cursor (mouse/trackpad only) */
.cursor{position:fixed;z-index:95;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--butter);pointer-events:none;mix-blend-mode:difference;display:grid;place-items:center;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s;opacity:0}
.cursor span{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:0;transition:opacity .2s}
.cursor.on{opacity:1}
.cursor.big{width:74px;height:74px;margin:-37px 0 0 -37px;mix-blend-mode:normal}
.cursor.big span{opacity:1}
.cursor.link{width:40px;height:40px;margin:-20px 0 0 -20px}
@media (hover:none),(pointer:coarse){.cursor{display:none}}
.has-cursor,.has-cursor a,.has-cursor button{cursor:none}

/* chocolate drip edges between sections */
.drip{position:absolute;left:0;right:0;top:-1px;height:clamp(40px,6vw,90px);z-index:2;pointer-events:none;color:var(--section-above,var(--butter))}
.drip svg{width:100%;height:100%;display:block}
.drip path{fill:currentColor}
.choc{--section-above:var(--butter)}
.choc .wrap,.visit .wrap{position:relative;z-index:3}
.visit{--section-above:var(--caramel)}

/* illusory fruit: a knife-slice wipe on change */
.fruit-view{overflow:hidden}
.fruit-view .slice{position:absolute;inset:-10%;z-index:5;pointer-events:none;background:linear-gradient(115deg,transparent 46%,rgba(255,253,248,.9) 50%,transparent 54%);transform:translateX(-120%)}

/* product image flying into the box */
.fly{position:fixed;z-index:96;width:64px;height:64px;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 14px 30px -8px rgba(0,0,0,.5);background:var(--butter)}

/* parallax photos: moved with the separate `translate` property so hover zoom (transform) still works */
.pcard .ph img,.slab-card .ph img{translate:0 var(--py,0px);height:calc(100% + 40px);top:-20px}
.slab-card .ph{position:relative}
.slab-card .ph img{position:absolute;inset:auto 0;width:100%}

/* hover wobble letters */
.hero-word span,footer .big span{cursor:default}

/* colour switcher (preview tool) */
.pal-btn{flex-direction:row-reverse;position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px;background:var(--cream);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.pal-btn i{display:flex;width:26px;height:26px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.pal-btn .t{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .4s var(--ease)}
.pal-btn:hover .t,.pal-btn:focus-visible .t,.pal-btn[aria-expanded="true"] .t{max-width:240px}
.pal-btn i b{flex:1}
.pal-panel{position:fixed;z-index:61;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--cream);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform:translateY(12px) scale(.98);opacity:0;visibility:hidden;transition:transform .35s var(--ease),opacity .25s,visibility .25s}
.pal-panel.on{transform:none;opacity:1;visibility:visible}
.pal-panel h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;margin:0 0 4px;line-height:1}

.pal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pal-grid button{border:2px solid transparent;border-radius:12px;padding:6px;background:transparent;cursor:pointer;display:grid;gap:5px;text-align:left;font-size:11px;font-weight:600;line-height:1.2}

.op-card h1{font-size:clamp(44px,11vw,76px)}
.op-card .hand{font-size:28px;color:var(--plum)}
.op-msg{margin:0;color:var(--muted-dark)}
.op-msg a{color:var(--plum);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11px;font-weight:600;text-align:center;color:var(--muted-dark)}
.steps li{display:grid;gap:6px;justify-items:center}
.steps i{width:100%;height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;position:relative}
.steps .was i{background:var(--plum)}
.steps .now{color:var(--ink)}
.steps .now i{background:color-mix(in srgb,var(--plum) 30%,transparent)}
.steps .now i::after{content:"";position:absolute;inset:0;background:var(--plum);transform-origin:left;animation:step-fill 1.6s var(--ease) infinite alternate}
@keyframes step-fill{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
.op-when{font-weight:600}
.op-when .hand{font-size:24px;margin-right:4px}
.op-pay:empty{display:none}
.op-pay{border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:20px;padding:18px 14px}
.op-lines{list-style:none;margin:0;padding:0}
.op-lines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.op-lines small{color:var(--muted-dark)}
.op-lines .tot{border:0;border-top:2px solid var(--ink);font-weight:700;padding-top:12px}
.op-lines .tot b{font-family:var(--display);font-weight:400;font-size:26px}
.op-card > .pill{justify-content:center}
.op-log summary{cursor:pointer;font-weight:600;font-size:14px}
.op-log ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted-dark)}
.op-mine{margin-top:26px;color:var(--cream)}
.op-mine h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;margin:0 0 8px}
.op-mine ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.op-mine a{color:var(--butter);font-weight:600}
.op-mine small{color:var(--muted-light)}
@media (max-width:480px){.steps{font-size:9.5px}.op-card{padding:22px 16px}}
@media (prefers-reduced-motion:reduce){.op-card,.steps .now i::after{animation:none}}

/* ---------- English / தமிழ் switch ---------- */
.lang-btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid color-mix(in srgb,var(--cream) 45%,transparent);background:color-mix(in srgb,var(--ink) 35%,transparent);
  color:var(--cream);border-radius:999px;padding:4px 12px 4px 4px;font:600 13px/1 var(--body);cursor:pointer;pointer-events:auto;white-space:nowrap;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .25s var(--ease),border-color .25s,transform .2s var(--ease)}
.lang-btn:hover{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.lang-btn:active{transform:scale(.96)}
.lang-btn:focus-visible{outline:2px solid var(--butter);outline-offset:3px}
.lang-btn .lb-a{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--butter);color:var(--ink);font:700 13px/1 "Noto Sans Tamil",var(--body)}
.lang-btn .lb-b{font-family:"Noto Sans Tamil",var(--body)}
/* header: logo · section links (centred in the space) · language switch + box, as before */
.nav .links{margin-inline:auto}
.nav .lang-btn{margin-left:0}
/* when there isn't room for the section links, they tuck away (as on phones) and the buttons move right */
@media (max-width:960px){.nav .links{display:none}.nav .lang-btn{margin-left:auto}}
@media (max-width:1180px){html[lang="ta"] .nav .links{display:none}html[lang="ta"] .nav .lang-btn{margin-left:auto}}
.op-top .lang-btn{margin-left:auto;margin-right:8px}
/* small phones: the switch shrinks to its round badge (EN / த) so the top bar stays on one line */
@media (max-width:420px){.lang-btn{padding:4px}.lang-btn .lb-b{display:none}}
html[lang="ta"] .box-btn{white-space:nowrap}
@media (max-width:420px){html[lang="ta"] .box-btn{font-size:12.5px;padding:8px 12px}}
html.lang-leaving body{opacity:0;transition:opacity .2s ease}

      bomboloni: M.bomboloni.map((b) => ({ ...item(b), en: tr(b.en) ?? b.en })),
      cookies: M.cookies.map(item), fruit: M.fruit.map(item), entremets: M.entremets.map(item), pastry: M.pastry.map(item), focaccia: M.focaccia.map(item),
      chocolates: { truffles: M.chocolates.truffles.map(item), bonbons: M.chocolates.bonbons.map(item) },
      kitchen: M.kitchen.map((g) => ({ ...g, group: tr(g.group) ?? g.group })),
    };
  }

  // The big SEREN (opening animation, logo, footer) rebuilt from whole Tamil letters, one span each,
  // so the rise-in, wobble and scroll-split animations work exactly as in English.
  function wordmark() {
    const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("ta", { granularity: "grapheme" }) : null;
    const letters = seg ? [...seg.segment(WORDMARK_TA)].map((x) => x.segment) : ["செ", "ரெ", "ன்"];
    document.querySelectorAll(".hero-word, .logo, footer .big").forEach((el) => {
      el.replaceChildren(...letters.map((ch) => { const s = document.createElement("span"); s.textContent = ch; return s; }));
      el.dataset.left = "1"; // how many letters sit on the dark side of the seam
      el.classList.add("wordmark-ta");
      if (el.hasAttribute("aria-label")) el.setAttribute("aria-label", el.classList.contains("logo") ? "செரென் முகப்பு" : WORDMARK_TA);
    });
  }
  wordmark();

  translateNode(document.body); // the page as written, before the animations split headings into letters
  new MutationObserver((list) => {
    for (const m of list) {
      if (m.type === "characterData") translateNode(m.target);
      else if (m.type === "attributes") translateNode(m.target.nodeType === 1 ? m.target : m.target.parentNode);
      else m.addedNodes.forEach(translateNode);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
})();

(function () {
  "use strict";
  const KEY = "seren-palette-v1";
  const ROLES = ["caramel", "plum", "aubergine", "butter", "cream", "ink"];
  const list = window.SEREN_PALETTES;
  const cfg = window.SEREN_CONFIG || {};
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function apply(p) {
    const root = document.documentElement;
    ROLES.forEach((r) => root.style.setProperty(`--${r}`, p[r]));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = p.plum;
  }
  function find(name) { return list.find((p) => p.name === name) || list[0]; }
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(name) { try { localStorage.setItem(KEY, name); } catch (e) { /* preview still works without storage */ } }

  const chosen = find(cfg.palette || "SEREN Original");
  apply(cfg.showPalettePicker ? find(saved() || chosen.name) : chosen);
  if (!cfg.showPalettePicker) return;

  const swatch = (p) => ROLES.map((r) => `<b style="background:${p[r]}"></b>`).join("");
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "pal-btn"; btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-controls", "palPanel");
  const panel = document.createElement("div");
  panel.id = "palPanel"; panel.className = "pal-panel"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "Try a colour palette");

  function render(active) {
    const dots = ["caramel", "plum", "butter"].map((r) => `<b style="background:${active[r]}"></b>`).join("");
    btn.innerHTML = `<i aria-hidden="true">${dots}</i><span class="t">Colours: ${esc(active.name)}&nbsp;</span>`;
    btn.setAttribute("aria-label", `Colours: ${active.name}. Try another palette`);
    panel.innerHTML = `<h3>Try a palette</h3><p>Preview only. Tell Claude the name you like and it becomes the site's colours.</p>
      <div class="pal-grid">${list.map((p) => `<button type="button" data-pal="${esc(p.name)}" aria-pressed="${p.name === active.name}"><span class="sw">${swatch(p)}</span>${esc(p.name)}</button>`).join("")}</div>`;
  }
  btn.addEventListener("click", () => {
    const on = !panel.classList.contains("on");
    panel.classList.toggle("on", on); btn.setAttribute("aria-expanded", String(on));
  });
  panel.addEventListener("click", (e) => {
    const b = e.target.closest("[data-pal]");
    if (!b) return;
    const p = find(b.dataset.pal);
    apply(p); save(p.name); render(p);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { panel.classList.remove("on"); btn.setAttribute("aria-expanded", "false"); } });
  render(find(saved() || chosen.name));
  document.body.append(btn, panel);
})();

/* Shared by the order box and the order page: talking to the order system and the UPI payment panel. */
window.SerenPay = (function () {
  "use strict";
  const API = String((window.SEREN_CONFIG || {}).api || "").replace(/\/+$/, "");
  const ORDERS_KEY = "seren-orders-v1";
  const QR_SRC = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  const QR_SRI = "sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (paise) => `₹${(paise / 100).toLocaleString("en-IN", { minimumFractionDigits: paise % 100 ? 2 : 0, maximumFractionDigits: 2 })}`;

  async function api(path, opts = {}) {
    if (!API) throw new Error("Online ordering isn't switched on yet.");
    let res;
    try {
      res = await fetch(API + path, {
        method: opts.method || "GET",
        headers: opts.body ? { "Content-Type": "application/json" } : {},
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
    } catch (e) {
      throw new Error("Couldn't reach SEREN. Check your internet and try again.");
    }
    let data = {};
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
    return data;
  }

  /* orders placed on this device, newest first, so customers can find them again */
  function savedOrders() {
    try { const v = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function rememberOrder(code, token) {
    const next = [{ code, token, at: Date.now() }, ...savedOrders().filter((o) => o.code !== code)].slice(0, 10);
    try { localStorage.setItem(ORDERS_KEY, JSON.stringify(next)); } catch (e) { /* private mode: the link still works */ }
  }
  const orderUrl = (code, token) => `order.html#${encodeURIComponent(code)}.${encodeURIComponent(token)}`;
  const invoiceUrl = (code, token) => `${API}/invoice/${encodeURIComponent(code)}?t=${encodeURIComponent(token)}`;

  let qrLoading;
  function loadQr() {
    if (window.qrcode) return Promise.resolve();
    qrLoading = qrLoading || new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = QR_SRC; s.integrity = QR_SRI; s.crossOrigin = "anonymous";
      s.onload = resolve; s.onerror = () => { qrLoading = null; reject(new Error("QR code didn't load")); };
      document.head.appendChild(s);
    });
    return qrLoading;
  }

  const isPhone = () => window.matchMedia("(pointer:coarse)").matches || window.innerWidth < 700;

  /**
   * Draws the "pay with UPI" panel into `el`.
   * pay = { code, token, total, upi, upiId, upiName, expiresAt }; onSubmitted runs after the customer sends their UPI ref.
   */
  function payPanel(el, pay, onSubmitted) {
    const mins = pay.expiresAt ? Math.max(0, Math.round((new Date(pay.expiresAt) - Date.now()) / 60000)) : null;
    el.innerHTML = `
      <div class="pay">
        <p class="pay-amt"><span>Pay</span> ${esc(money(pay.total))}</p>
        <p class="pay-note">Order <b>${esc(pay.code)}</b>${mins ? ` · please pay within ${mins} min` : ""}</p>
        ${isPhone() ? `<a class="pill fill pay-app" href="${esc(pay.upi)}">Pay with GPay, PhonePe or any UPI app</a>` : ""}
        <div class="pay-qr" aria-label="UPI QR code for ${esc(money(pay.total))}"><span class="hand">Loading QR…</span></div>
        <p class="pay-id">${isPhone() ? "Or pay" : "Scan with any UPI app, or pay"} to <b>${esc(pay.upiId)}</b> (${esc(pay.upiName)})
          <button type="button" class="linkish" data-copy="${esc(pay.upiId)}">Copy UPI ID</button></p>
        <form class="utr" novalidate>
          <label for="utr-${esc(pay.code)}">After paying, enter the 12-digit <b>UPI Ref No. / UTR</b> from your payment receipt</label>
          <div class="utr-row">
            <input id="utr-${esc(pay.code)}" name="utr" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="e.g. 412345678901" required>
            <button class="pill fill" type="submit">I've paid</button>
          </div>
          <p class="err" role="alert"></p>
        </form>
      </div>`;
    loadQr()
      .then(() => {
        const qr = window.qrcode(0, "M");
        qr.addData(pay.upi);
        qr.make();
        el.querySelector(".pay-qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      })
      .catch(() => { el.querySelector(".pay-qr").innerHTML = `<span>QR code couldn't load. Use the UPI ID below.</span>`; });

    el.querySelector("[data-copy]").addEventListener("click", async (e) => {
      try { await navigator.clipboard.writeText(e.currentTarget.dataset.copy); e.currentTarget.textContent = "Copied"; }
      catch (err) { e.currentTarget.textContent = "Select and copy the ID"; }
    });
    const form = el.querySelector("form.utr");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      const err = form.querySelector(".err");
      const utr = form.utr.value.replace(/\s+/g, "");
      if (!/^\d{12}$/.test(utr)) { err.textContent = "The UPI reference is 12 digits. Find it in your payment app's receipt."; form.utr.focus(); return; }
      btn.disabled = true; err.textContent = "";
      try {
        await api(`/api/orders/${encodeURIComponent(pay.code)}/payment`, { method: "POST", body: { t: pay.token, utr } });
        onSubmitted();
      } catch (ex) {
        err.textContent = ex.message; btn.disabled = false;
      }
    });
  }

  return { enabled: Boolean(API), api, money, esc, savedOrders, rememberOrder, orderUrl, invoiceUrl, payPanel };
})();

/* The order page: status timeline, UPI payment if still unpaid, invoice once paid. Link: order.html#CODE.TOKEN */
(function () {
  "use strict";
  const P = window.SerenPay;
  const { esc, money } = P;
  const card = document.getElementById("orderCard");
  const STEPS = [
    ["awaiting_payment", "Order placed"],
    ["payment_submitted", "Payment sent"],
    ["paid", "Payment confirmed"],
    ["preparing", "Being made"],
    ["ready", "Ready"],
    ["completed", "Done"],
  ];
  let timer;

  function parseHash() {
    const m = decodeURIComponent(location.hash.slice(1)).match(/^(SRN-[A-Z0-9]{6})\.([A-Za-z0-9_-]{32})$/);
    return m ? { code: m[1], token: m[2] } : null;
  }

  const when = (iso) => new Date(iso).toLocaleString(locale(), { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  const locale = () => (window.serenLocale ? window.serenLocale() : "en-IN");
  const timeLabel = (hhmm) => (window.serenTimeLabel ? window.serenTimeLabel(hhmm) : hhmm);
  const dayLabel = (ymd) => new Date(`${ymd}T00:00:00`).toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" });

  function stepIndex(status) {
    if (status === "out_for_delivery") return 4;
    if (status === "on_tab") return 2;
    return STEPS.findIndex(([s]) => s === status);
  }

  function render(data, ref) {
    const o = data.order;
    const stopped = o.status === "cancelled" || o.status === "expired";
    const at = stepIndex(o.status);
    const steps = STEPS.map(([s, label], i) => {
      const lbl = s === "ready" && o.mode === "delivery" ? (o.status === "out_for_delivery" ? "On the way" : "Ready to go")
        : s === "ready" && o.mode === "dinein" ? "Coming to you" : s === "completed" && o.mode === "dinein" ? "Served"
        : o.onTab && s === "paid" ? "In the kitchen" : o.onTab && s === "payment_submitted" ? "Pay at the end" : label;
      return `<li class="${i < at ? "was" : i === at ? "now" : ""}"><i></i>${esc(lbl)}</li>`;
    }).join("");
    card.innerHTML = `
      <p class="eyebrow">Order ${esc(o.code)}</p>
      <h1 class="display">${esc(o.statusLabel)}</h1>
      ${stopped ? `<p class="op-msg">${o.status === "expired" ? "This order wasn't paid in time. If you've already paid, enter your UPI reference below and we'll sort it out."
        : o.creditNote ? `This order was refunded (credit note ${esc(o.creditNote)}).` : "This order was cancelled. If you paid, we'll refund you. Questions? Call us."}</p>` : `<ol class="steps">${steps}</ol>`}
      ${o.onTab ? `<p class="op-msg">You're paying at the end. Tap <b>Ask for the bill</b> on the menu page when you're ready.</p>` : ""}
      <div class="op-when">${o.mode === "dinein"
        ? `<span class="hand">Dine-in</span> Table ${esc(o.table)}`
        : `<span class="hand">${o.mode === "delivery" ? "Delivery" : "Pickup"}</span> ${esc(dayLabel(o.date))} · ${esc(timeLabel(o.time))}`}</div>
      <div class="op-pay"></div>
      <ul class="op-lines">${o.lines.map((l) => `<li><span>${l.qty} × ${esc(l.name)}${l.unit ? ` <small>${esc(l.unit)}</small>` : ""}</span><b>${esc(money(l.amount))}</b></li>`).join("")}
        ${o.deliveryFee ? `<li><span>Delivery</span><b>${esc(money(o.deliveryFee))}</b></li>` : ""}
        ${o.discount ? `<li class="off"><span>Discount${o.coupon ? ` (${esc(o.coupon)})` : ""}</span><b>−${esc(money(o.discount))}</b></li>` : ""}
        <li class="tot"><span>Total</span><b>${esc(money(o.total))}</b></li></ul>
      ${data.canReview && o.status === "completed" ? reviewBlock(data) : ""}
      ${o.paid ? `<a class="pill fill" href="${esc(P.invoiceUrl(o.code, ref.token))}" target="_blank" rel="noopener">View &amp; print bill${o.invoiceNo ? ` · ${esc(o.invoiceNo)}` : ""}</a>` : ""}
      ${o.utr && !o.paid ? `<p class="op-msg">We have your UPI reference <b>${esc(o.utr)}</b> and we're checking it with the bank.</p>` : ""}
      ${data.contact.phone || data.contact.whatsapp ? `<p class="op-msg">Need help? ${data.contact.phone ? `Call <a href="tel:${esc(data.contact.phone)}">${esc(data.contact.phone)}</a>` : ""}
        ${data.contact.whatsapp ? `${data.contact.phone ? " or " : ""}<a href="https://wa.me/${esc(data.contact.whatsapp)}?text=${encodeURIComponent(`Hi SEREN, about order ${o.code}`)}" target="_blank" rel="noopener">WhatsApp us</a>` : ""}</p>` : ""}
      <details class="op-log"><summary>Order history</summary><ul>${o.events.map((e) => `<li>${esc(when(e.at))} · ${esc(e.label)}</li>`).join("")}</ul></details>`;
    wireReview(ref, data);
    if (data.pay) P.payPanel(card.querySelector(".op-pay"), { ...data.pay, code: o.code, token: ref.token, total: o.total, expiresAt: o.status === "expired" ? null : o.expiresAt }, () => load(ref));
    // keep checking until it's finished
    clearTimeout(timer);
    if (!["completed", "cancelled"].includes(o.status) && !data.pay) timer = setTimeout(() => load(ref), 20000);
  }

  // "How was it?": stars and a comment; happy customers get the Google review link.
  function reviewBlock(data) {
    const fb = data.feedback;
    return `<form class="review" novalidate>
      <p class="hand">${fb ? "Thanks for your rating!" : "How was it?"}</p>
      <div class="stars" role="radiogroup" aria-label="Your rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="${fb && fb.stars === n}" aria-label="${n} star${n > 1 ? "s" : ""}" data-star="${n}" class="${fb && fb.stars >= n ? "on" : ""}">★</button>`).join("")}</div>
      <textarea name="comment" rows="2" maxlength="500" placeholder="Tell us more (optional)">${esc(fb ? fb.comment : "")}</textarea>
      <button class="pill" type="submit">${fb ? "Update" : "Send"}</button>
      <p class="review-note" role="status"></p>
    </form>`;
  }

  function wireReview(ref, data) {
    const form = card.querySelector("form.review");
    if (!form) return;
    let stars = data.feedback ? data.feedback.stars : 0;
    form.querySelector(".stars").addEventListener("click", (e) => {
      const b = e.target.closest("[data-star]");
      if (!b) return;
      stars = Number(b.dataset.star);
      form.querySelectorAll("[data-star]").forEach((s) => { const n = Number(s.dataset.star); s.classList.toggle("on", n <= stars); s.setAttribute("aria-checked", String(n === stars)); });
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const out = form.querySelector(".review-note");
      if (!stars) { out.textContent = "Tap the stars first"; return; }
      try {
        const r = await P.api(`/api/orders/${encodeURIComponent(ref.code)}/feedback`, { method: "POST", body: { t: ref.token, stars, comment: form.elements.namedItem("comment").value } });
        out.innerHTML = r.googleReviewUrl ? `Thank you! Would you share it on Google? <a href="${esc(r.googleReviewUrl)}" target="_blank" rel="noopener">Write a Google review →</a>` : "Thank you! We read every message.";
      } catch (ex) { out.textContent = ex.message; }
    });
  }

  async function load(ref) {
    try {
      render(await P.api(`/api/orders/${encodeURIComponent(ref.code)}?t=${encodeURIComponent(ref.token)}`), ref);
    } catch (e) {
      card.innerHTML = `<h1 class="display">Hmm.</h1><p class="op-msg">${esc(e.message)}</p><button class="pill fill" type="button">Try again</button>`;
      card.querySelector("button").addEventListener("click", () => load(ref));
    }
  }

  function mine(current) {
    const list = P.savedOrders().filter((o) => !current || o.code !== current.code);
    const box = document.getElementById("myOrders");
    box.hidden = !list.length;
    box.querySelector("ul").innerHTML = list.map((o) => `<li><a href="${esc(P.orderUrl(o.code, o.token))}">${esc(o.code)}</a> <small>${esc(new Date(o.at).toLocaleDateString("en-IN"))}</small></li>`).join("");
  }

  function start() {
    const ref = parseHash();
    mine(ref);
    if (ref) { load(ref); return; }
    card.innerHTML = `<h1 class="display">Your orders</h1><p class="op-msg">${P.savedOrders().length ? "Pick an order below." : "Orders you place on this phone show up here. Open the link from your order to see it."}</p>`;
  }
  window.addEventListener("hashchange", start);
  start();
})();

</script>
